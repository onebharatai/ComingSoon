<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegRev - Coming Soon</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            /* Fallback */
            background-color: #020617;
        }

        .bg-mesh {
            background-color: #020617;
            background-image:
                radial-gradient(at 0% 0%, hsla(160, 84%, 10%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(161, 94%, 20%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(180, 50%, 10%, 1) 0, transparent 50%);
        }
    </style>
</head>

<body
    class="bg-mesh text-white min-h-screen flex flex-col relative overflow-hidden font-sans antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Ambient Background Blobs -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div
            class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-emerald-600/10 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-blob">
        </div>
        <div
            class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-teal-600/10 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-blob animation-delay-2000">
        </div>
        <div
            class="absolute bottom-[-10%] left-[20%] w-[500px] h-[500px] bg-cyan-600/10 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-blob animation-delay-4000">
        </div>
    </div>

    <!-- Header -->
    <header class="relative z-50 w-full p-6 md:p-8 flex items-center">
        <img src="assets/logo_transparent.png" alt="RegRev Logo" class="h-20 w-auto">
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 relative z-10">

        <!-- Glass Card -->
        <div class="w-full max-w-3xl p-1 animate-fade-in-up">
            <div
                class="relative overflow-hidden rounded-3xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-2xl p-8 sm:p-16 md:p-24 text-center group transition-all duration-500 hover:bg-white/10">

                <!-- Inner Glow -->
                <div
                    class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-32 bg-emerald-500/5 blur-[50px] rounded-full pointer-events-none">
                </div>

                <!-- Text Content -->
                <h1
                    class="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tighter mb-6 text-transparent bg-clip-text bg-gradient-to-br from-white via-white to-emerald-400/80 drop-shadow-sm pb-2">
                    Compliance Without Compromise
                </h1>

                <p class="text-xl md:text-2xl text-slate-300 font-light tracking-wide mb-8">
                    Building in progress
                </p>

                <!-- Join Waitlist Button -->
                <div class="mb-4">
                    <a href="https://tally.so/r/Y5Wpgq" target="_blank"
                        class="inline-flex items-center justify-center px-8 py-4 text-lg font-semibold text-white transition-all duration-300 bg-emerald-600/20 backdrop-blur-lg border border-emerald-500/30 rounded-full hover:bg-emerald-600/40 hover:scale-105 active:scale-95 shadow-xl group/btn">
                        Join Waitlist
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="w-5 h-5 ml-2 transform transition-transform group-hover/btn:translate-x-1"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </a>
                </div>

                <!-- Subtle separator/accent -->
                <!-- <div class="mt-8 flex justify-center space-x-3">
                    <span class="w-3 h-3 rounded-full bg-blue-500/50 animate-pulse"></span>
                    <span class="w-3 h-3 rounded-full bg-purple-500/50 animate-pulse delay-75"></span>
                    <span class="w-3 h-3 rounded-full bg-indigo-500/50 animate-pulse delay-150"></span>
                </div> -->
            </div>
        </div>

    </main>

    <!-- Footer Space (Optional balance) -->
    <footer class="h-16"></footer>

</body>

</html>
