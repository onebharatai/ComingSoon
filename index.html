<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegRev - Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            /* Fallback */
            background-color: #020617;
        }

        .bg-mesh {
            background-color: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
        }
    </style>
</head>

<body
    class="bg-mesh text-white min-h-screen flex flex-col relative overflow-hidden font-sans antialiased selection:bg-purple-500 selection:text-white">

    <!-- Ambient Background Blobs -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div
            class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-600/20 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-blob">
        </div>
        <div
            class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-indigo-600/20 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-blob animation-delay-2000">
        </div>
        <div
            class="absolute bottom-[-10%] left-[20%] w-[500px] h-[500px] bg-blue-600/20 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-blob animation-delay-4000">
        </div>
    </div>

    <!-- Header -->
    <header class="relative z-50 w-full p-6 md:p-8">
        <div class="text-2xl font-bold tracking-tight text-white/90">
            RegRev
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 relative z-10">

        <!-- Glass Card -->
        <div class="w-full max-w-3xl p-1 animate-fade-in-up">
            <div
                class="relative overflow-hidden rounded-3xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-2xl p-16 md:p-24 text-center group transition-all duration-500 hover:bg-white/10">

                <!-- Inner Glow -->
                <div
                    class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-32 bg-white/5 blur-[50px] rounded-full pointer-events-none">
                </div>

                <!-- Text Content -->
                <h1
                    class="text-7xl md:text-8xl font-extrabold tracking-tighter mb-6 text-transparent bg-clip-text bg-gradient-to-br from-white via-white to-white/50 drop-shadow-sm pb-2">
                    Coming Soon
                </h1>

                <p class="text-2xl md:text-3xl text-slate-300 font-light tracking-wide mb-2">
                    Building in progress
                </p>

                <!-- Subtle separator/accent -->
                <div class="mt-12 flex justify-center space-x-3">
                    <span class="w-3 h-3 rounded-full bg-blue-500/50 animate-pulse"></span>
                    <span class="w-3 h-3 rounded-full bg-purple-500/50 animate-pulse delay-75"></span>
                    <span class="w-3 h-3 rounded-full bg-indigo-500/50 animate-pulse delay-150"></span>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Space (Optional balance) -->
    <footer class="h-16"></footer>

</body>

</html>
